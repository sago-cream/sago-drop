name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: swift test
      - run: scripts/smoke-upload-progress
      - run: scripts/package-app 0.0.0
        env:
          SAGO_DROP_CODESIGN_IDENTITY: "-"
